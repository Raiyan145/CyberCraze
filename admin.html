<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — CyberCraze</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="index.html"><span class="brand-dot"></span> CYBER<span>CRAZE</span> <small>ADMIN</small></a>
    <a class="nav-cta" href="index.html">Customer Site</a>
  </nav>
  <main class="admin-page">
    <div class="section-head">
      <div><p class="eyebrow">OWNER CONTROL</p><h1>Booking dashboard</h1></div>
      <button class="btn ghost" id="clearDemo">Clear demo bookings</button>
    </div>
    <div class="metrics">
      <div class="metric"><small>TODAY'S BOOKINGS</small><strong id="mBookings">0</strong></div>
      <div class="metric"><small>TODAY'S REVENUE</small><strong id="mRevenue">৳0</strong></div>
      <div class="metric"><small>BOOKED HOURS</small><strong id="mHours">0</strong></div>
      <div class="metric"><small>AVAILABLE HOURS</small><strong id="mAvailable">12</strong></div>
    </div>
    <div class="admin-grid">
      <section class="panel">
        <div class="panel-head"><h2>Today's timeline</h2><span>10 AM — 10 PM</span></div>
        <div id="adminSlots" class="admin-slots"></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Recent bookings</h2><span id="bookingCount">0 total</span></div>
        <div id="bookingList" class="booking-list"></div>
      </section>
    </div>
  </main>
  <script src="assets/admin.js"></script>
</body>
</html>
