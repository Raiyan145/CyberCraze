<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Book Your Session — CyberCraze</title>

  <link rel="stylesheet" href="assets/style.css">
</head>

<body>

  <!-- ================= NAVBAR ================= -->

  <nav class="nav">

    <a href="index.html" class="brand">
      <span class="brand-dot"></span>
      CYBER<span>CRAZE</span>
    </a>

    <a href="index.html" class="nav-cta">
      Back to Home
    </a>

  </nav>


  <!-- ================= BOOKING PAGE ================= -->

  <main class="booking-page">

    <div class="booking-intro">

      <p class="eyebrow">
        RESERVE YOUR SESSION
      </p>

      <h1>
        Choose your<br>
        <span>game time.</span>
      </h1>

      <p>
        10 AM – 10 PM · Full-hour sessions ·
        Book up to 3 days ahead.
      </p>

    </div>


    <!-- ================= BOOKING CARD ================= -->

    <form
      id="bookingForm"
      class="booking-card"
    >

      <!-- DATE -->

      <section class="form-section">

        <label>
          01 · DATE
        </label>

        <div
          id="dateChoices"
          class="choice-row"
        ></div>

      </section>


      <!-- TIME -->

      <section class="form-section">

        <label>
          02 · START TIME
        </label>

        <div
          id="timeChoices"
          class="time-grid"
        ></div>

      </section>


      <!-- DURATION -->

      <section class="form-section">

        <label>
          03 · DURATION
        </label>

        <div
          id="durationChoices"
          class="choice-row"
        ></div>

      </section>


      <!-- PLAYERS -->

      <section class="form-section">

        <label>
          04 · PLAYERS
        </label>

        <div class="player-options">

          <button
            type="button"
            class="player-card active"
            data-players="1"
          >

            <b>1</b>

            <span>
              Player
            </span>

            <strong>
              ৳100 / hour
            </strong>

          </button>


          <button
            type="button"
            class="player-card"
            data-players="2"
          >

            <b>2</b>

            <span>
              Players · 2 controllers
            </span>

            <strong>
              ৳150 / hour total
            </strong>

          </button>

        </div>

      </section>


      <!-- CUSTOMER DETAILS -->

      <section class="form-section customer-info">

        <label>
          05 · YOUR DETAILS
        </label>

        <input
          id="customerName"
          type="text"
          maxlength="80"
          placeholder="Your name"
          autocomplete="name"
          required
        >

        <input
          id="customerPhone"
          type="tel"
          maxlength="20"
          placeholder="Mobile number"
          autocomplete="tel"
          required
        >

      </section>


      <!-- SUMMARY -->

      <div class="summary">

        <div>

          <span>
            Session
          </span>

          <strong id="summarySession">
            —
          </strong>

        </div>


        <div>

          <span>
            Players
          </span>

          <strong id="summaryPlayers">
            1 player
          </strong>

        </div>


        <div class="total">

          <span>
            Total
          </span>

          <strong id="totalPrice">
            ৳100
          </strong>

        </div>

      </div>


      <!-- ERROR -->

      <p
        id="formError"
        class="form-note"
      ></p>


      <!-- CONFIRM -->

      <button
        type="submit"
        id="confirmBtn"
        class="btn primary full"
      >
        Continue Booking →
      </button>

    </form>

  </main>


  <!-- ================= SUCCESS MODAL ================= -->

  <div
    id="successModal"
    class="modal hidden"
  >

    <div class="modal-card">

      <div class="success-icon">
        ✓
      </div>

      <p class="eyebrow">
        BOOKING READY
      </p>

      <h2>
        You're all set.
      </h2>

      <p id="successText">
        Your booking details have been prepared.
      </p>

      <button
        id="continueBtn"
        class="btn primary full"
        type="button"
      >
        Continue
      </button>

    </div>

  </div>


  <!-- ================= SCRIPT ================= -->

  <script src="assets/supabase-config.js"></script>

  <script src="assets/booking.js"></script>

</body>

</html>
